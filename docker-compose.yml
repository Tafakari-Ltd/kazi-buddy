version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: kazi-buddy-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-kazibuddy}
      - POSTGRES_USER=${DB_USER:-kazibuddy_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-kazibuddy_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kazibuddy_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kazi-network

  # Redis for Django Channels
  redis:
    image: redis:7-alpine
    container_name: kazi-buddy-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kazi-network

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kazi-buddy-web
    command: daphne -b 0.0.0.0 -p 8000 tafakari.asgi:application
    volumes:
      - ./tafakari:/app/tafakari
      - static_volume:/app/tafakari/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-kazibuddy_user}:${DB_PASSWORD:-kazibuddy_password}@db:5432/${DB_NAME:-kazibuddy}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kazi-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:

networks:
  kazi-network:
    driver: bridge
