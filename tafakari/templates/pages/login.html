<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .center {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 400px;
            padding: 20px;
            border: 1px solid gray;
            border-radius: 4px;
        }

        .title {
            text-align: center;
        }

        .user-type-selector {
            margin: 20px 0;
        }

        .user-type-selector label {
            display: block;
            margin: 10px 0;
        }

        .google-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .google-btn:hover {
            background-color: #357ae8;
        }
    </style>
</head>

<body>
    <div class="center">
        <div class="container">
            <h1 class="title">Sign in</h1>

            <div class="user-type-selector">
                <p>Select your account type:</p>
                <label>
                    <input type="radio" name="user_type" value="worker" checked> Worker
                </label>
                <label>
                    <input type="radio" name="user_type" value="employer"> Employer
                </label>
            </div>

            <a href="#" id="google-login-btn" class="google-btn">
                Sign in with Google
            </a>
        </div>
    </div>

    <script>
        // Build Google OAuth URL with user_type in state parameter
        const googleBtn = document.getElementById('google-login-btn');

        googleBtn.addEventListener('click', function (e) {
            e.preventDefault();

            // Get selected user type
            const userType = document.querySelector('input[name="user_type"]:checked').value;

            // Use state parameter to pass user_type (this is the proper OAuth way)
            const state = JSON.stringify({ user_type: userType });

            // Build Google OAuth URL with state parameter
            const googleAuthUrl = 'https://accounts.google.com/o/oauth2/v2/auth' +
                '?redirect_uri=' + encodeURIComponent('{{ google_callback_uri }}') +
                '&prompt=consent' +
                '&response_type=code' +
                '&client_id={{ google_client_id }}' +
                '&scope=openid%20email%20profile' +
                '&access_type=offline' +
                '&state=' + encodeURIComponent(state);

            // Redirect to Google
            window.location.href = googleAuthUrl;
        });
    </script>
</body>

</html>
